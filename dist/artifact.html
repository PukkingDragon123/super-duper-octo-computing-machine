<title>BP MAN - PSL CITY</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #05060b;
  color: #cfd6e4;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 0%, #1b1140 0%, #0a0716 45%, #05060b 100%);
}

#stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas#screen {
  display: block;
  outline: none;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  border-radius: 4px;
  box-shadow:
    0 0 0 2px #241a4d,
    0 0 34px rgba(120, 80, 255, 0.35),
    0 0 90px rgba(255, 91, 208, 0.18);
}

#boot {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  letter-spacing: 2px;
  color: #6f7bb0;
}

canvas#screen:focus-visible {
  box-shadow:
    0 0 0 2px #ffd75e,
    0 0 34px rgba(255, 215, 94, 0.4),
    0 0 90px rgba(255, 91, 208, 0.18);
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
<div id="stage">
  <canvas id="screen" width="448" height="610"></canvas>
  <div id="boot">LOADING PSL CITY...</div>
</div>
<script>
/* ------------------------------------------------------------------
   font.js -- 5x7 bitmap arcade font.
   Every glyph is 7 rows of 5 columns, '1' = lit pixel.
   ------------------------------------------------------------------ */
(function (BP) {
  'use strict';

  var G = {
    'A': '01110/10001/10001/11111/10001/10001/10001',
    'B': '11110/10001/10001/11110/10001/10001/11110',
    'C': '01110/10001/10000/10000/10000/10001/01110',
    'D': '11100/10010/10001/10001/10001/10010/11100',
    'E': '11111/10000/10000/11110/10000/10000/11111',
    'F': '11111/10000/10000/11110/10000/10000/10000',
    'G': '01110/10001/10000/10111/10001/10001/01111',
    'H': '10001/10001/10001/11111/10001/10001/10001',
    'I': '11111/00100/00100/00100/00100/00100/11111',
    'J': '00111/00010/00010/00010/00010/10010/01100',
    'K': '10001/10010/10100/11000/10100/10010/10001',
    'L': '10000/10000/10000/10000/10000/10000/11111',
    'M': '10001/11011/10101/10101/10001/10001/10001',
    'N': '10001/11001/10101/10011/10001/10001/10001',
    'O': '01110/10001/10001/10001/10001/10001/01110',
    'P': '11110/10001/10001/11110/10000/10000/10000',
    'Q': '01110/10001/10001/10001/10101/10010/01101',
    'R': '11110/10001/10001/11110/10100/10010/10001',
    'S': '01111/10000/10000/01110/00001/00001/11110',
    'T': '11111/00100/00100/00100/00100/00100/00100',
    'U': '10001/10001/10001/10001/10001/10001/01110',
    'V': '10001/10001/10001/10001/10001/01010/00100',
    'W': '10001/10001/10001/10101/10101/11011/10001',
    'X': '10001/10001/01010/00100/01010/10001/10001',
    'Y': '10001/10001/01010/00100/00100/00100/00100',
    'Z': '11111/00001/00010/00100/01000/10000/11111',
    '0': '01110/10011/10011/10101/11001/11001/01110',
    '1': '00100/01100/00100/00100/00100/00100/01110',
    '2': '01110/10001/00001/00010/00100/01000/11111',
    '3': '11111/00010/00100/00010/00001/10001/01110',
    '4': '00010/00110/01010/10010/11111/00010/00010',
    '5': '11111/10000/11110/00001/00001/10001/01110',
    '6': '00110/01000/10000/11110/10001/10001/01110',
    '7': '11111/00001/00010/00100/01000/01000/01000',
    '8': '01110/10001/10001/01110/10001/10001/01110',
    '9': '01110/10001/10001/01111/00001/00010/01100',
    ' ': '00000/00000/00000/00000/00000/00000/00000',
    '-': '00000/00000/00000/11111/00000/00000/00000',
    '_': '00000/00000/00000/00000/00000/00000/11111',
    '.': '00000/00000/00000/00000/00000/01100/01100',
    ',': '00000/00000/00000/00000/01100/01100/01000',
    '!': '00100/00100/00100/00100/00100/00000/00100',
    '?': '01110/10001/00001/00010/00100/00000/00100',
    ':': '00000/01100/01100/00000/01100/01100/00000',
    "'": '00100/00100/00000/00000/00000/00000/00000',
    '/': '00001/00010/00010/00100/01000/01000/10000',
    '+': '00000/00100/00100/11111/00100/00100/00000',
    '=': '00000/00000/11111/00000/11111/00000/00000',
    '<': '00010/00100/01000/10000/01000/00100/00010',
    '>': '01000/00100/00010/00001/00010/00100/01000',
    '(': '00010/00100/01000/01000/01000/00100/00010',
    ')': '01000/00100/00010/00010/00010/00100/01000',
    '*': '00000/10101/01110/11111/01110/10101/00000',
    '%': '11001/11010/00010/00100/01000/01011/10011',
    '#': '01010/11111/01010/01010/01010/11111/01010',
    '@': '01110/10001/10111/10101/10111/10000/01110'
  };

  // Decode once into arrays of [x,y] lit pixels for fast blitting.
  var CACHE = {};
  function glyph(ch) {
    var g = CACHE[ch];
    if (g) return g;
    var src = G[ch] || G['?'];
    var rows = src.split('/');
    var pts = [];
    for (var y = 0; y < rows.length; y++) {
      for (var x = 0; x < 5; x++) {
        if (rows[y].charAt(x) === '1') pts.push(x, y);
      }
    }
    CACHE[ch] = pts;
    return pts;
  }

  var CW = 6; // glyph advance (5 + 1 spacing)
  var CH = 7;

  /**
   * Draw pixel text.
   * @param {CanvasRenderingContext2D} g
   * @param {string} text
   * @param {number} x left edge (or anchor, see align)
   * @param {number} y top edge
   * @param {object} [o] {color, scale, align:'left'|'center'|'right', shadow, track}
   */
  function text(g, str, x, y, o) {
    o = o || {};
    var s = o.scale || 1;
    var track = o.track === undefined ? 1 : o.track;
    var adv = (5 + track) * s;
    str = String(str).toUpperCase();
    var w = str.length * adv - track * s;
    var ox = x;
    if (o.align === 'center') ox = Math.round(x - w / 2);
    else if (o.align === 'right') ox = Math.round(x - w);

    if (o.shadow) {
      var so = Math.min(3, Math.max(1, o.shadowOffset || Math.round(s / 2)));
      g.fillStyle = o.shadow;
      blit(g, str, ox + so, y + so, s, adv);
    }
    g.fillStyle = o.color || '#fff';
    blit(g, str, ox, y, s, adv);
    return w;
  }

  function blit(g, str, ox, oy, s, adv) {
    for (var i = 0; i < str.length; i++) {
      var ch = str.charAt(i);
      if (ch === ' ') continue;
      var pts = glyph(ch);
      var gx = ox + i * adv;
      for (var p = 0; p < pts.length; p += 2) {
        g.fillRect(gx + pts[p] * s, oy + pts[p + 1] * s, s, s);
      }
    }
  }

  function measure(str, scale, track) {
    var s = scale || 1;
    var t = track === undefined ? 1 : track;
    return String(str).length * (5 + t) * s - t * s;
  }

  BP.font = { text: text, measure: measure, CW: CW, CH: CH };
})(window.BP = window.BP || {});

/* ------------------------------------------------------------------
   maze.js -- the city block plan.

     '#' building      '.' black pill on the sidewalk
     'o' hammer        '-' club door        ' ' bare street
     ',' park path with a pill   ';' bare park path   'T' tree

   Long uninterrupted runs are AVENUES: traffic drives down them.
   ------------------------------------------------------------------ */
(function (BP) {
  'use strict';

  var RAW = [
    '############################',
    '#............##............#',
    '#.####.#####.##.#####.####.#',
    '#o####.#####.##.#####.####o#',
    '#.####.#####.##.#####.####.#',
    '#..........................#',
    '#.####.##.########.##.####.#',
    '#.####.##.########.##.####.#',
    '#......##....##....##......#',
    '######.##### ## #####.######',
    '     #.##### ## #####.#     ',
    '     #.##          ##.#     ',
    '     #.## ###--### ##.#     ',
    '######.## #      # ##.######',
    '      .   #      #   .      ',
    '######.####      ####.######',
    '     #.,,,########,,,.#     ',
    '     #.,,TT,,TT,,TT,,.#     ',
    '     #.,,,TT,,,TT,,,,.#     ',
    '######.##############.######',
    '#............##............#',
    '#.####.#####.##.#####.####.#',
    '#.####.#####.##.#####.####.#',
    '#o..##.......  .......##..o#',
    '###.##.##.########.##.##.###',
    '###.##.##.########.##.##.###',
    '#......##....##....##......#',
    '#.##########.##.##########.#',
    '#.##########.##.##########.#',
    '#..........................#',
    '############################'
  ];

  var EMPTY = 0, WALL = 1, PILL = 2, HAMMER = 3, GATE = 4, PARK = 5, TREE = 6, PARKPILL = 7;

  var COLS = 28, ROWS = 31, TILE = 16;

  function build() {
    var grid = [], pills = 0, r, c;
    for (r = 0; r < ROWS; r++) {
      var row = [];
      for (c = 0; c < COLS; c++) {
        var ch = RAW[r].charAt(c);
        var v = EMPTY;
        if (ch === '#') v = WALL;
        else if (ch === '.') { v = PILL; pills++; }
        else if (ch === 'o') { v = HAMMER; pills++; }
        else if (ch === '-') v = GATE;
        else if (ch === 'T') v = TREE;
        else if (ch === ';') v = PARK;
        else if (ch === ',') { v = PARKPILL; pills++; }
        row.push(v);
      }
      grid.push(row);
    }
    return { grid: grid, pills: pills };
  }

  /** Static terrain lookup -- what the tile is regardless of pickups. */
  function terrain(c, r) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return EMPTY;
    var ch = RAW[r].charAt(c);
    if (ch === 'T') return TREE;
    if (ch === ',' || ch === ';') return PARK;
    if (ch === '#') return WALL;
    if (ch === '-') return GATE;
    return EMPTY;
  }

  var TUNNEL_ROW = 14;

  function tileAt(grid, c, r) {
    if (r < 0 || r >= ROWS) return WALL;
    if (c < 0 || c >= COLS) return (r === TUNNEL_ROW) ? EMPTY : WALL;
    return grid[r][c];
  }

  /** Can a walker stand here?  `gate` = allowed through the club door. */
  function open(grid, c, r, gate) {
    var t = tileAt(grid, c, r);
    if (t === WALL || t === TREE) return false;
    if (t === GATE) return !!gate;
    return true;
  }

  function isPark(c, r) { return terrain(c, r) === PARK; }

  // Traffic runs these straight shots.  dir is the axis; `at` is the row
  // (for 'h') or column (for 'v'); span is the open stretch.
  var AVENUES = [
    { axis: 'h', at: 5,  from: 1, to: 26, name: 'FIFTH AVE' },
    { axis: 'h', at: 29, from: 1, to: 26, name: 'CANAL ST' },
    { axis: 'v', at: 6,  from: 1, to: 26, name: 'BROADWAY' },
    { axis: 'v', at: 21, from: 1, to: 26, name: 'PARK AVE' }
  ];

  function onAvenue(c, r) {
    for (var i = 0; i < AVENUES.length; i++) {
      var a = AVENUES[i];
      if (a.axis === 'h' && r === a.at && c >= a.from && c <= a.to) return a;
      if (a.axis === 'v' && c === a.at && r >= a.from && r <= a.to) return a;
    }
    return null;
  }

  BP.maze = {
    RAW: RAW,
    COLS: COLS, ROWS: ROWS, TILE: TILE,
    W: COLS * TILE, H: ROWS * TILE,
    EMPTY: EMPTY, WALL: WALL, PILL: PILL, HAMMER: HAMMER,
    GATE: GATE, PARK: PARK, TREE: TREE, PARKPILL: PARKPILL,
    TUNNEL_ROW: TUNNEL_ROW, AVENUES: AVENUES,
    build: build, tileAt: tileAt, open: open, terrain: terrain,
    isPark: isPark, onAvenue: onAvenue,

    playerSpawn: { c: 13.5, r: 23 },
    gate: { c: 13.5, r: 12 },
    clubCenter: { c: 13.5, r: 14 },
    bonusSpot: { c: 13.5, r: 17 },        // in the park
    rivalSpawns: [
      { c: 13.5, r: 11 },
      { c: 13.5, r: 14 },
      { c: 11.5, r: 14 },
      { c: 15.5, r: 14 }
    ],
    scatterTargets: [
      { c: 25, r: 0 }, { c: 2, r: 0 }, { c: 27, r: 30 }, { c: 0, r: 30 }
    ]
  };
})(window.BP = window.BP || {});

/* ------------------------------------------------------------------
   face.js -- a parametric human face, 20 x 24 pixels.

   Drives BP MAN's PSL ascent (soft and round -> jawline + hunter eyes)
   and doubles as the face of every rival, boss and pedestrian by way
   of a palette override.  Callers blit it at whatever integer scale
   they need: 1x on the street sprite, 2x in the HUD, 5x in a cutscene.

   Vertical budget:  0-5 hair | 5-6 brow | 7-11 eyes | 11-14 nose
                     15-16 mouth | 16-19 chin | 19-23 neck
   ------------------------------------------------------------------ */
(function (BP) {
  'use strict';

  var W = 20, H = 24;

  /* ---------------- colour ---------------- */
  function hex(c) {
    var n = parseInt(c.slice(1), 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  }
  function str(a) {
    return '#' + ((1 << 24) + (a[0] << 16) + (a[1] << 8) + a[2]).toString(16).slice(1);
  }
  function mix(a, b, t) {
    var x = hex(a), y = hex(b);
    return str([
      Math.round(x[0] + (y[0] - x[0]) * t),
      Math.round(x[1] + (y[1] - x[1]) * t),
      Math.round(x[2] + (y[2] - x[2]) * t)
    ]);
  }

  /** Build a full shading ramp from a base skin and hair colour. */
  function palette(o) {
    o = o || {};
    var skin = o.skin || '#f0b78a';
    var hair = o.hair || '#3d2a20';
    return {
      hi:   mix(skin, '#fff2e0', 0.45),
      skin: skin,
      mid:  mix(skin, '#7a3f20', 0.22),
      sh:   mix(skin, '#7a3f20', 0.42),
      dk:   mix(skin, '#5c2c14', 0.60),
      line: mix(skin, '#3a1608', 0.78),
      stub: mix(skin, '#4a2a18', 0.30),
      lip:   mix(skin, '#b8402e', 0.45),
      lipDk: mix(skin, '#7a2418', 0.62),
      hairHi: mix(hair, '#ffe0b0', 0.26),
      hair:   hair,
      hairDk: mix(hair, '#000000', 0.42),
      white: '#fdfbf6',
      iris:   o.iris || '#5a8cbe',
      irisDk: mix(o.iris || '#5a8cbe', '#000018', 0.45),
      pupil: '#141821'
    };
  }
  var DEFAULT = palette();

  // Skull half-width per row, index 2..19.
  var SOFT = [0, 0, 5.5, 6.6, 7.2, 7.6, 7.9, 8.0, 8.0, 8.0,
                   8.0, 7.9, 7.8, 7.6, 7.3, 6.9, 6.3, 5.4, 4.2, 2.6];
  var CHAD = [0, 0, 5.8, 6.9, 7.6, 8.0, 8.2, 8.3, 8.3, 8.1,
                   7.6, 7.1, 6.9, 7.1, 7.6, 8.0, 8.0, 6.8, 4.8, 2.8];

  function lerp(a, b, t) { return a + (b - a) * t; }

  function r(g, x, y, w, h, col) {
    if (w <= 0 || h <= 0) return;
    g.fillStyle = col;
    g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }
  function mir(g, x, y, w, h, col) {   // a rect and its mirror image
    r(g, x, y, w, h, col);
    r(g, W - x - w, y, w, h, col);
  }

  function halfWidths(t) {
    var out = [];
    for (var i = 0; i < SOFT.length; i++) out.push(lerp(SOFT[i], CHAD[i], t));
    return out;
  }

  /* ================================================================
     FRONT
     ================================================================ */
  function front(g, tier, o) {
    o = o || {};
    var C = o.pal || DEFAULT;
    var ex = o.expr || 'neutral';
    var t = tier / 4;
    var hw = halfWidths(t);
    var hard = tier >= 2;
    var y, xl, xr, x;

    for (y = 2; y <= 19; y++) {                // skull
      xl = Math.round(10 - hw[y]);
      xr = Math.round(10 + hw[y]);
      r(g, xl, y, xr - xl, 1, C.skin);
      r(g, xr - 2, y, 2, 1, C.mid);            // light from upper-left
      r(g, xr - 1, y, 1, 1, C.sh);
      r(g, xl, y, 1, 1, C.mid);
    }

    r(g, 7, 5, 6, 1, C.hi);                    // forehead sheen
    mir(g, 5, 6, 2, 1, C.hi);

    if (hard) {
      mir(g, 2, 10, 3, 1, C.hi);               // cheekbone catch-light
      mir(g, 2, 12, 3, 2, C.sh);               // hollow beneath it
      mir(g, 3, 14, 2, 1, C.mid);
      mir(g, 2, 15, 2, 2, C.sh);               // masseter
    }

    if (hard) {                                // jaw
      xl = Math.round(10 - hw[16]);
      r(g, xl, 16, 2, 1, C.dk);                // gonial angle
      r(g, W - xl - 2, 16, 2, 1, C.dk);
      mir(g, xl + 1, 17, 3, 1, C.sh);          // mandible border
      r(g, 7, 18, 6, 1, C.sh);
      r(g, 8, 17, 4, 2, C.hi);                 // lit chin block
      if (tier >= 4) r(g, 10, 18, 1, 1, C.mid);
    } else {
      r(g, 7, 18, 6, 1, C.mid);
      mir(g, 5, 17, 2, 1, C.mid);
    }

    xl = Math.round(10 - hw[10]);              // ears
    mir(g, xl - 1, 9, 1, 4, C.mid);
    mir(g, xl - 1, 10, 1, 2, C.sh);

    var nh = Math.round(lerp(4, 6.5, t));      // neck & traps
    r(g, 10 - nh, 19, nh * 2, 5, C.mid);
    r(g, 10 - nh, 19, nh * 2, 1, C.dk);
    r(g, 10 - nh, 20, 2, 4, C.sh);
    r(g, 10 + nh - 2, 20, 2, 4, C.sh);
    if (tier >= 3) { r(g, 8, 21, 1, 3, C.sh); r(g, 11, 21, 1, 3, C.sh); }

    if (o.stubble !== false && tier >= 3) {
      for (y = 15; y <= 19; y++) {
        xl = Math.round(10 - hw[y]) + 1;
        xr = Math.round(10 + hw[y]) - 1;
        for (x = xl; x < xr; x++) {
          if (((x + y) & 1) !== 0) continue;
          if (y >= 16 && y <= 17 && Math.abs(x - 10) < 4) continue;
          r(g, x, y, 1, 1, C.stub);
        }
      }
      mir(g, 6, 15, 2, 1, C.stub);
    }

    hairFront(g, tier, hw, C, o.hairStyle);
    brows(g, tier, hard, ex, C);
    eyes(g, tier, hard, ex, C, o);
    nose(g, hard, C);
    mouth(g, hard, ex, C, o);
  }

  function brows(g, tier, hard, ex, C) {
    if (ex === 'scared' || ex === 'soy') {
      mir(g, 3, 4, 5, 1, C.hairDk);            // shot up
      mir(g, 3, 5, 2, 1, C.hairDk);
      return;
    }
    if (ex === 'angry' || ex === 'smug') {
      mir(g, 3, 6, 6, 2, C.hairDk);            // driven down at the inner end
      mir(g, 7, 8, 2, 1, C.hairDk);
      return;
    }
    if (!hard) {
      mir(g, 4, 6, 4, 1, C.hairHi);
      mir(g, 5, 5, 2, 1, C.hairHi);
    } else {
      mir(g, 4, 7, 5, 1, C.hair);
      mir(g, 4, 6, 3, 1, C.hair);
      mir(g, 4, 7, 2, 1, C.hairDk);
    }
  }

  function eyes(g, tier, hard, ex, C, o) {
    if (ex === 'soy' || ex === 'scared') {
      mir(g, 3, 8, 6, 6, C.white);
      mir(g, 3, 8, 6, 1, C.line);
      mir(g, 5, 10, 2, 2, C.pupil);
      return;
    }
    if (o.blink) { mir(g, 4, 10, 5, 1, C.line); return; }
    if (ex === 'smug') {                       // lidded and amused
      mir(g, 4, 9, 6, 1, C.line);
      mir(g, 4, 10, 5, 2, C.white);
      mir(g, 5, 10, 3, 2, C.iris);
      mir(g, 6, 10, 2, 2, C.pupil);
      mir(g, 4, 12, 5, 1, C.sh);
      return;
    }
    if (tier <= 1) {                           // doe
      mir(g, 4, 8, 5, 1, C.line);
      mir(g, 4, 9, 5, 4, C.white);
      mir(g, 4, 9, 1, 1, C.skin); mir(g, 8, 9, 1, 1, C.skin);
      mir(g, 4, 12, 1, 1, C.skin); mir(g, 8, 12, 1, 1, C.skin);
      mir(g, 5, 10, 3, 3, C.iris);
      mir(g, 6, 10, 2, 2, C.pupil);
      mir(g, 5, 10, 1, 1, C.white);
      return;
    }
    if (tier === 2) {
      mir(g, 4, 8, 6, 1, C.line);
      mir(g, 4, 9, 5, 3, C.white);
      mir(g, 5, 9, 3, 3, C.iris);
      mir(g, 6, 10, 2, 2, C.pupil);
      mir(g, 5, 9, 1, 1, C.white);
      mir(g, 4, 12, 5, 1, C.sh);
      return;
    }
    // hunter: hooded, narrow, outer corner a pixel above the inner

        g.fillStyle = '#666d80'; g.fillRect(x + 3 + i * 4, y + 5, 2, 1);

      g.fillStyle = '#3a4152'; g.fillRect(x + 4, y + 5, 8, 6);
      g.fillStyle = mix(D.neon, '#ffffff', 0.4); g.fillRect(x + 5, y + 6, 6, 4);
      g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(x + 7, y + 6, 1, 4);

  /** A quiet stretch of wall: brick and a couple of dark windows. */
  function plainFace(g, rand, c, r, D) {
    var x = c * T, y = r * T + 8, i;
    var tone = mix(D.brick[(c * 5 + r * 11) & 3], '#000000', 0.15);
    g.fillStyle = tone;
    g.fillRect(x, y, T, T - 8);
    g.fillStyle = mix(tone, '#ffffff', 0.16);
    g.fillRect(x, y, T, 1);
    for (i = 0; i < 4; i++) {
      g.fillStyle = rand() < 0.5 ? mix(tone, '#ffffff', 0.06) : mix(tone, '#000000', 0.2);
      g.fillRect(x + (rand() * T | 0), y + 2 + (rand() * 5 | 0), 2, 1);

    for (i = 0; i < 2; i++) {
      var wx = x + 3 + i * 7;
      g.fillStyle = '#0b0d13'; g.fillRect(wx, y + 3, 4, 4);
      if (rand() < 0.16) { g.fillStyle = WINDOW_LIT[(c + r + i) & 3]; g.fillRect(wx + 1, y + 3, 2, 4); }
      g.fillStyle = mix(tone, '#ffffff', 0.22); g.fillRect(wx - 1, y + 2, 6, 1);
    }

  /** The street-facing side of a building: windows, then a shopfront. */
  function facade(g, rand, c, r, D, props) {
    var x = c * T, y = r * T + 6, i;
    var tone = D.brick[(c * 5 + r * 11) & 3];
    var h = T - 6;

    g.fillStyle = tone;
    g.fillRect(x, y, T, h);
    g.fillStyle = mix(tone, '#ffffff', 0.22);   // cornice
    g.fillRect(x, y, T, 1);
    g.fillStyle = mix(tone, '#000000', 0.3);
    g.fillRect(x, y + 1, T, 1);
    for (i = 0; i < 6; i++) {                   // brick grain
      g.fillStyle = rand() < 0.5 ? mix(tone, '#ffffff', 0.08) : mix(tone, '#000000', 0.18);
      g.fillRect(x + (rand() * T | 0), y + 2 + (rand() * (h - 2) | 0), 2, 1);
    }

    for (i = 0; i < 2; i++) {
      var wx = x + 2 + i * 8, wy = y + 2;
      g.fillStyle = '#0e1017'; g.fillRect(wx, wy, 4, 3);
      if (rand() < 0.24) {
        g.fillStyle = WINDOW_LIT[(c + r + i) & 3];
        g.fillRect(wx, wy, 4, 3);
        g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(wx + 2, wy + 1, 1, 2);
      }
      g.fillStyle = mix(tone, '#ffffff', 0.3);
      g.fillRect(wx - 1, wy - 1, 6, 1);         // stone lintel
    }

    var gy = y + 6, roll = rand();
    if (roll < 0.30) {                          // shopfront with an awning
      var col = ['#8a2a26', '#26597e', '#256b45', '#7e5d22'][(c + r) & 3];
      g.fillStyle = '#101219'; g.fillRect(x + 1, gy + 2, T - 2, h - 8);
      g.fillStyle = mix(D.neon, '#ffffff', 0.25);
      g.fillRect(x + 3, gy + 3, T - 6, 2);
      for (i = 0; i < 4; i++) {                 // striped awning
        g.fillStyle = (i & 1) ? col : '#9aa2b4';
        g.fillRect(x + i * 4, gy, 4, 2);

      g.fillStyle = '#101219'; g.fillRect(x + 6, gy + 1, 5, h - 7);
      g.fillStyle = mix(tone, '#ffe0a0', 0.35); g.fillRect(x + 6, gy + 1, 5, 1);
      g.fillStyle = '#3c4150';
      for (i = 0; i < 3; i++) g.fillRect(x + 5 - i, gy + h - 6 + i, 7 + i * 2, 1);

      g.fillStyle = '#0e1017'; g.fillRect(x + 2, gy + 2, T - 4, h - 9);
      if (rand() < 0.3) { g.fillStyle = 'rgba(201,160,94,0.4)'; g.fillRect(x + 2, gy + 2, T - 4, h - 9); }

  /* ================================================================
     THE PARK
     ================================================================ */
  function parkGround(g, rand, c, r, D, props) {
    var x = c * T, y = r * T, i;

      g.fillRect(x + (rand() * T | 0), y + (rand() * T | 0), 1, 1);
    }

    g.fillStyle = '#7d715a';
    g.fillRect(x, y + 6, T, 5);
    g.fillStyle = '#8d8067';
    for (i = 0; i < 6; i++) g.fillRect(x + (rand() * T | 0), y + 6 + (rand() * 5 | 0), 1, 1);
    g.fillStyle = '#5c5343';

      g.fillStyle = '#755134'; g.fillRect(x + 3, y + 1, 10, 1);

    } else if (roll < 0.24) {                   // park lamp

      g.fillStyle = '#ffe6a8'; g.fillRect(x + 6, y, 4, 2);

      gr.addColorStop(0, 'rgba(255,230,168,0.22)');
      gr.addColorStop(1, 'rgba(255,230,168,0)');

    } else if (roll < 0.30) {                   // shrubs
      g.fillStyle = '#2c5c33'; g.fillRect(x + 2, y + 12, 5, 3);
      g.fillStyle = '#3a7541'; g.fillRect(x + 2, y + 12, 5, 1);
      g.fillStyle = '#2c5c33'; g.fillRect(x + 9, y + 12, 4, 3);
    }

  function tree(g, rand, c, r) {
    var x = c * T, y = r * T;
    g.fillStyle = '#2f5c37'; g.fillRect(x, y, T, T);
    g.fillStyle = '#3d2a18';                    // trunk
    g.fillRect(x + 7, y + 9, 3, 7);

  /* ================================================================
     BAKE
     ================================================================ */
  function build(grid, level) {
    var D = districtFor(level);

    var b = canvas(M.W, M.H), g = b.g;
    var props = { steam: [], neon: [], blinkers: [], lights: [] };
    var c, r, t;

    g.fillStyle = '#0a0c12';
    g.fillRect(0, 0, M.W, M.H);

        if (t === M.PARK) { parkGround(g, rand, c, r, D, props); continue; }
        if (t === M.WALL) continue;

      for (c = 0; c < M.COLS; c++) {
        if (M.terrain(c, r) !== M.GATE) continue;
        var x = c * T, y = r * T;
        g.fillStyle = '#101219'; g.fillRect(x, y, T, T);
        g.fillStyle = '#7a1f4a'; g.fillRect(x, y + 5, T, 5);
        g.fillStyle = mix(D.neon, '#ffffff', 0.3); g.fillRect(x, y + 6, T, 2);
        g.fillStyle = 'rgba(255,120,190,0.25)'; g.fillRect(x, y + 3, T, 9);
        props.neon.push({ x: x, y: y + 6, w: T, h: 2, col: '#ff8fd0', phase: rand() * 7 });
      }

    M.AVENUES.forEach(function (a) {
      M.AVENUES.forEach(function (bAv) {
        if (a.axis !== 'h' || bAv.axis !== 'v') return;
        var cc = bAv.at, rr = a.at;
        if (cc < bAv.from || cc > bAv.to) return;

    // be the pills, the people and the hammers, all drawn after this.
    g.fillStyle = 'rgba(18,14,42,0.34)';
    g.fillRect(0, 0, M.W, M.H);

    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.35)');
    g.fillStyle = vig;
    g.fillRect(0, 0, M.W, M.H);

    return { img: b.c, props: props, district: D };
  }

  /** Pills live on their own layer: eating one is a single clearRect. */
  function pillLayer(grid, sprites) {
    var b = canvas(M.W, M.H), g = b.g;
    g.imageSmoothingEnabled = false;
    for (var r = 0; r < M.ROWS; r++) {
      for (var c = 0; c < M.COLS; c++) {
        var t = grid[r][c];
        if (t !== M.PILL && t !== M.PARKPILL) continue;
        g.drawImage(sprites.PILL, c * T + (T - 8) / 2, r * T + (T - 6) / 2);
      }
    }
    return b.c;
  }

  /** Night sky and a distant skyline, used behind the HUD. */
  function skyline(w, h, level, band) {
    var D = districtFor(level);
    var rand = rng(0x51ce + level * 104729);
    band = Math.min(h, band || h);
    var b = canvas(w, h), g = b.g, i;
    var grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, '#05060f');
    grd.addColorStop(0.5, D.sky[0]);
    grd.addColorStop(1, D.sky[1]);
    g.fillStyle = grd;
    g.fillRect(0, 0, w, h);
    for (i = 0; i < Math.round(w * h / 900); i++) {
      g.fillStyle = 'rgba(255,255,255,' + (0.12 + rand() * 0.5).toFixed(2) + ')';
      g.fillRect(rand() * w | 0, rand() * Math.max(1, h - band * 0.8) | 0, 1, 1);
    }
    var mx = w - 40, my = 16, mr = 8;
    var mg = g.createRadialGradient(mx, my, 1, mx, my, mr * 3);
    mg.addColorStop(0, 'rgba(246,238,222,0.28)');
    mg.addColorStop(1, 'rgba(246,238,222,0)');
    g.fillStyle = mg;
    g.fillRect(mx - mr * 3, my - mr * 3, mr * 6, mr * 6);
    for (var yy = -mr; yy <= mr; yy++) {
      var half = Math.round(Math.sqrt(mr * mr - yy * yy));
      g.fillStyle = '#f6eede';
      g.fillRect(mx - half, my + yy, half * 2, 1);
    }
    g.fillStyle = '#ddd2bd';
    g.fillRect(mx + 1, my - 3, 3, 3);
    g.fillRect(mx - 4, my + 2, 2, 2);

    var x = -4;
    while (x < w) {
      var bw = 9 + (rand() * 18 | 0);
      var bh = 12 + (rand() * (band - 14) | 0);
      g.fillStyle = rand() < 0.5 ? mix(D.sky[1], '#000000', 0.45) : mix(D.sky[1], '#000000', 0.62);
      g.fillRect(x, h - bh, bw, bh);
      if (rand() < 0.22) {                      // a spire
        g.fillRect(x + (bw >> 1) - 1, h - bh - 7, 2, 7);
      }
      for (var wy = h - bh + 3; wy < h - 2; wy += 4) {
        for (var wx = x + 2; wx < x + bw - 2; wx += 3) {
          if (rand() < 0.28) {
            g.fillStyle = rand() < 0.7 ? 'rgba(255,208,122,0.7)' : 'rgba(120,220,255,0.7)';
            g.fillRect(wx, wy, 1, 2);
          }
        }
      }
      x += bw + 1 + (rand() * 3 | 0);
    }
    return b.c;
  }

  BP.city = {
    build: build, pillLayer: pillLayer, skyline: skyline,
    districtFor: districtFor, isBoss: isBoss, DISTRICTS: DISTRICTS,
    canvas: canvas, rng: rng

})(window.BP = window.BP || {});

/* ------------------------------------------------------------------
   traffic.js -- the avenues are live.  Cabs, sedans, box trucks and
   the crosstown bus run the long straight shots; getting clipped
   costs you PSL, not a life.

   Every car is telegraphed: headlights flare at the mouth of the
   avenue and the horn sounds before it enters.
   ------------------------------------------------------------------ */
(function (BP) {
  'use strict';

  var M = BP.maze, T = M.TILE;

  function canvas(w, h) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;

  function rect(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(x, y, w, h); }
  var mix = BP.face.mix;

  /* ---------------- vehicles ---------------- */
  var TYPES = [
    { key: 'cab',   len: 30, body: '#f2c12e', roof: '#d9a71c', trim: '#141821', weight: 5, speed: 2.7 },
    { key: 'sedan', len: 30, body: '#2c3140', roof: '#20242f', trim: '#0e1017', weight: 3, speed: 2.9 },
    { key: 'van',   len: 36, body: '#dfe4ee', roof: '#b8bfcd', trim: '#171a22', weight: 2, speed: 2.3 },
    { key: 'bus',   len: 46, body: '#3f7fc4', roof: '#31649b', trim: '#101319', weight: 1, speed: 1.9 }

    rect(g, 0, 3, L, W - 6, t.body);

    rect(g, 2, W - 1, L - 4, 1, t.trim);
    rect(g, 1, 1, L - 2, 1, mix(t.body, '#ffffff', 0.4));  // top highlight
    rect(g, 1, W - 3, L - 2, 2, mix(t.body, '#000000', 0.35));

    var cabX = t.key === 'bus' ? 6 : Math.round(L * 0.30);
    var cabW = t.key === 'bus' ? L - 12 : Math.round(L * 0.40);
    rect(g, cabX, 2, cabW, W - 4, t.roof);               // roof
    rect(g, cabX, 2, cabW, 1, mix(t.roof, '#ffffff', 0.25));
    rect(g, cabX + cabW, 3, 3, W - 6, '#8fb6d8');        // windshield
    rect(g, cabX - 3, 3, 3, W - 6, '#6f93b4');           // rear glass
    rect(g, cabX + cabW + 3, 4, 1, W - 8, 'rgba(255,255,255,0.5)');

    rect(g, L - 2, 2, 2, 3, '#fff6d0');                  // headlights
    rect(g, L - 2, W - 5, 2, 3, '#fff6d0');
    rect(g, 0, 2, 1, 3, '#d8322c');                      // tail lights
    rect(g, 0, W - 5, 1, 3, '#d8322c');
    rect(g, cabX + cabW - 1, 1, 2, 1, t.trim);           // mirrors
    rect(g, cabX + cabW - 1, W - 2, 2, 1, t.trim);
    rect(g, 4, 0, 5, 1, '#0c0e14');                      // tyres

    var pts = 200 * Math.pow(2, Math.min(3, G.mogStreak));
    G.mogStreak++;
    G.mogs++;
    addScore(pts);
    gh.mode = 'down'; gh.downT = 0.9; gh.tileKey = '';
    G.player.swing = 0.4;
    pop(gh.x, gh.y - 22, 'MOGGED', '#ff5bd0');
    pop(gh.x, gh.y - 34, '+' + pts, '#ffd75e');
    burst(gh.x, gh.y - 8, 26, ['#ffd75e', '#ff5bd0', '#ffffff', '#4de1ff'], 3);
    shake(5);
    G.freeze = 0.4;
    A.sfx.hammer(); A.sfx.mog(G.mogStreak);
    gainPSL(0.15);
  }

  function damageBoss(n) {
    var b = G.boss;
    if (!b || b.stun > 0 || b.hp <= 0) return;
    b.hp -= n;
    b.stun = 1.8;
    b.flashT = 0.5;
    shake(8);
    burst(b.x, b.y - 10, 34, ['#ffd75e', '#ff5b7a', '#ffffff'], 3.4);
    A.sfx.hammer();
    if (b.hp <= 0) {
      G.bossDown = true;
      pop(b.x, b.y - 40, 'APEX MOGGED', '#ffd75e');
      addScore(5000);
      gainPSL(1.2);
      G.freeze = 0.6;
      A.sfx.tierUp();
    } else {
      pop(b.x, b.y - 40, b.hp + ' LEFT', '#ff5b7a');
      A.sfx.mog(1);
    }
  }

  function startMogMode() {
    var dur = Math.max(3.2, 8.5 - (G.level - 1) * 0.4);
    G.mogTimer = dur;
    G.mogStreak = 0;
    G.rivals.forEach(function (gh) {
      if (gh.mode === 'roam') { gh.mode = 'cooked'; gh.dir = [-gh.dir[0], -gh.dir[1]]; gh.tileKey = ''; }
    });
    shake(3);
    A.sfx.pickup();
  }

  function fireAura() {
    if (G.aura < 100 || G.state !== 'play') return;
    G.aura = 0;
    G.wave = { x: G.player.x, y: G.player.y, r: 0, life: 0.85, hit: [], boss: false };
    G.mogStreak = Math.max(G.mogStreak, 1);
    shake(9); G.flash = 0.25;
    burst(G.player.x, G.player.y - 10, 46, ['#ffd75e', '#fff3c4', '#ff5bd0'], 4);
    pop(G.player.x, G.player.y - 44, 'AURA BURST', '#ffd75e');
    A.sfx.aura();
  }

  /* ---------------- update ---------------- */
  function update(dt) {
    G.t += dt; G.stateT += dt;
    if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 22);
    if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 1.6);
    updateFx(dt);

    switch (G.state) {
      case 'title': break;
      case 'ready': if (G.stateT > 2.0) { G.state = 'play'; G.stateT = 0; } break;
      case 'play': play(dt); break;
      case 'dying':
        if (G.stateT > 2.3) {
          G.lives--;
          if (G.lives <= 0) { saveBest(); G.state = 'gameover'; G.stateT = 0; A.sfx.gameover(); }
          else { resetActors(); G.state = 'ready'; G.stateT = 0; A.sfx.start(); }
        }
        break;
      case 'levelclear':
        if (G.stateT > 2.6) {
          G.level++; loadLevel(); G.state = 'ready'; G.stateT = 0; A.sfx.start();
        }
        break;
      case 'ascend':
        if (G.stateT > 3.6) { G.state = G.pillsLeft <= 0 ? 'levelclear' : 'play'; G.stateT = 0; }
        break;
      default: break;
    }
  }

  function updateFx(dt) {
    var i, p;
    for (i = G.particles.length - 1; i >= 0; i--) {
      p = G.particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.98;
      p.life -= dt;
      if (p.life <= 0) G.particles.splice(i, 1);
    }
    for (i = G.pops.length - 1; i >= 0; i--) {
      p = G.pops[i];
      p.y -= dt * 16; p.life -= dt;
      if (p.life <= 0) G.pops.splice(i, 1);
    }
    if (G.wave) {
      G.wave.r += dt * 620;
      G.wave.life -= dt;
      for (i = 0; i < G.rivals.length; i++) {
        var gh = G.rivals[i];
        if (gh.mode === 'home' || gh.mode === 'club' || gh.mode === 'down') continue;
        if (G.wave.hit.indexOf(i) >= 0) continue;
        if (Math.hypot(gh.x - G.wave.x, gh.y - G.wave.y) <= G.wave.r) {
          G.wave.hit.push(i);
          gh.mode = 'cooked';
          mogRival(gh);
          G.freeze = 0;
        }
      }
      if (G.boss && !G.wave.boss && G.boss.hp > 0 &&
          Math.hypot(G.boss.x - G.wave.x, G.boss.y - G.wave.y) <= G.wave.r) {
        G.wave.boss = true;
        G.boss.stun = 0;
        damageBoss(2);
      }
      if (G.wave.life <= 0) G.wave = null;
    }
  }

  function play(dt) {
    if (G.freeze > 0) { G.freeze -= dt; return; }
    var p = G.player;

    if (G.mogTimer <= 0) {
      G.phaseT += dt;
      if (G.phaseT > PHASES[Math.min(G.phase, PHASES.length - 1)]) {
        G.phaseT = 0; G.phase++;
        G.rivals.forEach(function (gh) {
          if (gh.mode === 'roam') { gh.dir = [-gh.dir[0], -gh.dir[1]]; gh.tileKey = ''; }
        });
      }
    } else {
      G.mogTimer -= dt;
      if (G.mogTimer <= 0) {
        G.mogTimer = 0;
        G.rivals.forEach(function (gh) { if (gh.mode === 'cooked') { gh.mode = 'roam'; gh.tileKey = ''; } });
      }
    }

    // --- player ---
    if (p.stun > 0) { p.stun -= dt; p.moving = false; }
    else {
      p.running = p.wantRun && G.stamina > 1 && p.moving !== false;
      var moved = step(p, playerSpeed(), false);
      if (p.running && moved) G.stamina = Math.max(0, G.stamina - dt * 30);
      else G.stamina = Math.min(100, G.stamina + dt * (moved ? 14 : 26));
      if (G.stamina <= 0) p.running = false;
      if (moved) {
        p.anim += playerSpeed();
        p.frame = Math.floor(p.anim / (p.running ? 3.4 : 4.6)) & 3;
        p.mouth = (Math.floor(p.anim / 6) & 1);
      } else { p.mouth = 0; }
      facing(p);
      eat();
    }
    if (p.invuln > 0) p.invuln -= dt;
    if (p.swing > 0) p.swing -= dt;

    // --- rivals ---
    G.rivals.forEach(function (gh) {
      gh.anim += 1;
      if (gh.mode === 'club') {
        gh.clubT -= dt; gh.bob += dt * 4;
        gh.y = gh.home.y + Math.sin(gh.bob) * 3;
        gh.frame = (Math.floor(G.t * 3) & 3);
        gh.vw = 'front';
        if (gh.clubT <= 0) { gh.mode = 'leave'; gh.tileKey = ''; }
        return;
      }
      if (gh.mode === 'down') {
        gh.downT -= dt;
        if (gh.downT <= 0) { gh.mode = 'home'; gh.tileKey = ''; }
        return;
      }
      if (gh.mode === 'hit') {
        gh.downT -= dt;
        if (gh.downT <= 0) { gh.mode = 'roam'; gh.tileKey = ''; }
        return;
      }
      if (gh.mode === 'leave') {
        var gx = (M.gate.c + 0.5) * T, gy = (M.gate.r - 0.6) * T, sp = 1.5;
        if (Math.abs(gh.x - gx) > sp) gh.x += Math.sign(gx - gh.x) * sp;
        else {
          gh.x = gx; gh.y -= sp;
          if (gh.y <= gy) {
            gh.y = gy; gh.mode = G.mogTimer > 0 ? 'cooked' : 'roam';
            gh.tileKey = ''; gh.dir = Math.random() < 0.5 ? LEFT : RIGHT;
          }
        }
        gh.vw = 'back'; gh.frame = (Math.floor(G.t * 8) & 3);
        return;
      }
      if (gh.mode === 'home') {
        var hx = (M.clubCenter.c + 0.5) * T, hy = (M.clubCenter.r + 0.5) * T;
        if (Math.hypot(gh.x - hx, gh.y - hy) < 6) {
          gh.mode = 'club'; gh.clubT = 1.4; gh.x = hx; gh.y = hy; gh.tileKey = '';
          return;
        }
        think(gh, { c: Math.floor(M.gate.c), r: M.gate.r }, true);
        step(gh, rivalSpeed(gh), true);
        facing(gh);
        gh.frame = (Math.floor(gh.anim / 3) & 3);
        return;
      }
      var target;
      if (gh.mode === 'cooked') {
        var pc = tileC(G.player), pr = tileR(G.player);
        target = { c: tileC(gh) * 2 - pc, r: tileR(gh) * 2 - pr };
      } else {
        target = scattering() ? M.scatterTargets[gh.i] : chaseTarget(gh);
      }
      think(gh, target, false, true);
      step(gh, rivalSpeed(gh), false);
      facing(gh);
      gh.frame = (Math.floor(gh.anim / (gh.mode === 'roam' ? 4 : 3.4)) & 3);
    });

    // --- boss ---
    if (G.boss && G.boss.hp > 0) {
      var b = G.boss;
      if (b.flashT > 0) b.flashT -= dt;
      if (b.stun > 0) { b.stun -= dt; }
      else {
        think(b, { c: tileC(G.player), r: tileR(G.player) }, true);
        step(b, Math.min(2.0, 1.62 + (G.level - 1) * 0.02), true);
        facing(b);
        b.anim += 1;
        b.frame = (Math.floor(b.anim / 3.2) & 3);
      }
    }

    // --- traffic ---
    G.carTimer -= dt;
    if (G.carTimer <= 0 && G.cars.length < 3) {
      var car = TR.spawn(G.level, p);
      if (car) { G.cars.push(car); A.sfx.horn && A.sfx.horn(); }
      G.carTimer = Math.max(2.6, 7.5 - (G.level - 1) * 0.5) * (0.7 + Math.random() * 0.6);
    }
    for (var i = G.cars.length - 1; i >= 0; i--) {
      var cr = G.cars[i];
      var alive = TR.update(cr, dt);
      if (!alive) { G.cars.splice(i, 1); continue; }
      if (p.invuln <= 0 && p.stun <= 0 && TR.hits(cr, p.x, p.y, 4)) hitByCar(cr);
      G.rivals.forEach(function (gh) {
        if (gh.mode !== 'roam' && gh.mode !== 'cooked') return;
        if (!TR.hits(cr, gh.x, gh.y, 2)) return;
        gh.mode = 'hit'; gh.downT = 1.8;
        burst(gh.x, gh.y - 8, 12, ['#ffffff', '#ffd75e'], 2);
        pop(gh.x, gh.y - 24, 'SPLAT', '#8fb6d8');
      });
    }

    collide();

    if (G.bonus) { G.bonus.life -= dt; if (G.bonus.life <= 0) G.bonus = null; }

    if (G.boss && G.bossDown && G.state === 'play') {
      G.state = 'levelclear'; G.stateT = 0; A.sfx.level();
    }
  }

  function hitByCar(car) {
    var p = G.player;
    p.stun = 0.85; p.invuln = 2.0;
    losePSL(0.35);
    shake(9);
    burst(p.x, p.y - 8, 20, ['#ffffff', '#ffd75e', '#8fb6d8'], 3);
    pop(p.x, p.y - 40, '-0.35 PSL', '#ff5b7a');
    pop(p.x, p.y - 52, 'CLIPPED', '#ffffff');
    A.sfx.crash ? A.sfx.crash() : A.sfx.death();
  }

  function eat() {
    var p = G.player;
    var c = tileC(p), r = tileR(p);
    if (c < 0 || c >= M.COLS || r < 0 || r >= M.ROWS) return;
    var t = G.grid[r][c];
    if (t === M.PILL || t === M.PARKPILL || t === M.HAMMER) {
      G.grid[r][c] = M.terrain(c, r) === M.PARK ? M.PARK : M.EMPTY;
      G.pillsLeft--; G.pillsEaten++;
      G.pillImg.getContext('2d').clearRect(c * T, r * T, T, T);
      if (t === M.HAMMER) {
        addScore(60); G.aura = Math.min(100, G.aura + 14);
        gainPSL(0.05);
        for (var i = 0; i < G.hammers.length; i++)
          if (G.hammers[i].c === c && G.hammers[i].r === r) G.hammers.splice(i, 1);
        burst(p.x, p.y - 10, 18, ['#ffd75e', '#e8eefc', '#ff5bd0'], 2.4);
        pop(p.x, p.y - 42, 'HAMMER TIME', '#ffd75e');
        startMogMode();
      } else {
        addScore(10); G.aura = Math.min(100, G.aura + 1.7);
        gainPSL(0.005);
        A.sfx.chomp();
      }
      if ((G.pillsEaten === 70 || G.pillsEaten === 180) && !G.bonus) {
        G.bonus = {
          idx: Math.min(G.level - 1, S.ITEMS.length - 1),
          x: (M.bonusSpot.c + 0.5) * T, y: (M.bonusSpot.r + 0.5) * T, life: 11
        };
      }
      if (G.pillsLeft <= 0 && !(G.boss && G.boss.hp > 0)) {
        gainPSL(0.3);
        G.state = 'levelclear'; G.stateT = 0;
        A.sfx.level();
      }
    }
    if (G.bonus && Math.hypot(p.x - G.bonus.x, p.y - G.bonus.y) < 14) {
      var it = S.ITEMS[G.bonus.idx];
      addScore(it.points);
      G.aura = Math.min(100, G.aura + 20);
      G.stamina = 100;
      gainPSL(it.psl);
      pop(G.bonus.x, G.bonus.y - 24, it.name, '#7cf5d0');
      pop(G.bonus.x, G.bonus.y - 36, '+' + it.psl.toFixed(2) + ' PSL', '#ffd75e');
      burst(G.bonus.x, G.bonus.y, 22, ['#7cf5d0', '#ffd75e', '#ffffff'], 2.6);
      if (G.bonus.idx === 3) startMogMode();
      G.bonus = null;
      A.sfx.pickup();
    }
  }

  function collide() {
    var p = G.player;
    if (p.invuln > 0) return;
    for (var i = 0; i < G.rivals.length; i++) {
      var gh = G.rivals[i];
      if (gh.mode !== 'roam' && gh.mode !== 'cooked') continue;
      if (Math.hypot(p.x - gh.x, p.y - gh.y) > 14) continue;
      if (gh.mode === 'cooked') mogRival(gh);
      else return caught();
    }
    if (G.boss && G.boss.hp > 0 && Math.hypot(p.x - G.boss.x, p.y - G.boss.y) < 18) {
      if (G.mogTimer > 0) { p.swing = 0.4; damageBoss(1); }
      else return caught();
    }
  }

  function caught() {
    G.state = 'dying'; G.stateT = 0;
    G.mogTimer = 0;
    losePSL(0.7);
    shake(7);
    A.sfx.death();
  }

  /* ---------------- render ---------------- */
  var faceCache = {};
  function faceImg(v, tier) {
    var key = v + tier;
    if (faceCache[key]) return faceCache[key];
    var b = S.canvas(FACE.W, FACE.H);
    FACE.draw(b.g, v, tier, {});
    faceCache[key] = b.c;
    return b.c;
  }

  function render() {
    bg.save();
    bg.fillStyle = '#05060b';
    bg.fillRect(0, 0, VIEW_W, VIEW_H);

    if (G.state === 'title') { drawTitle(); bg.restore(); blit(); return; }

    var sx = 0, sy = 0;
    if (G.shake > 0.2) { sx = (Math.random() - 0.5) * G.shake; sy = (Math.random() - 0.5) * G.shake; }
    bg.translate(Math.round(sx), Math.round(sy));
    drawCity();
    drawActors();
    drawFx();
    bg.translate(-Math.round(sx), -Math.round(sy));

    if (G.flash > 0) {
      bg.fillStyle = 'rgba(255,240,190,' + (G.flash * 0.6).toFixed(3) + ')';
      bg.fillRect(0, MAZE_Y, M.W, M.H);
    }
    drawHud();
    drawOverlays();
    bg.restore();
    blit();
  }

  function blit() {
    vg.imageSmoothingEnabled = false;
    vg.clearRect(0, 0, view.width, view.height);
    vg.drawImage(buf, 0, 0, view.width, view.height);
  }

  function drawCity() {
    bg.drawImage(G.mazeImg, 0, MAZE_Y);
    bg.drawImage(G.pillImg, 0, MAZE_Y);

    var P = G.props, i, s;
    for (i = 0; i < P.neon.length; i++) {        // flickering shop signs
      s = P.neon[i];
      var f = 0.55 + 0.45 * Math.sin(G.t * 3 + s.phase);
      if (Math.sin(G.t * 21 + s.phase * 4) > 0.93) f *= 0.25;
      bg.globalAlpha = f;
      bg.fillStyle = s.col;
      bg.fillRect(s.x, MAZE_Y + s.y, s.w, s.h);
      bg.globalAlpha = f * 0.3;
      bg.fillRect(s.x - 1, MAZE_Y + s.y - 2, s.w + 2, s.h + 4);
      bg.globalAlpha = 1;
    }
    for (i = 0; i < P.blinkers.length; i++) {    // tower warning lights
      s = P.blinkers[i];
      if (Math.sin(G.t * 2.4 + i) > 0.4) {
        bg.fillStyle = '#ff4d4d';
        bg.fillRect(s.x - 1, MAZE_Y + s.y - 1, 2, 2);
      }
    }
    for (i = 0; i < P.steam.length; i++) {       // steam off the manholes
      s = P.steam[i];
      var k = ((G.t * 0.55 + s.phase) % 2.2) / 2.2;
      var a = (1 - k) * (s.weak ? 0.13 : 0.22);
      var rad = 3 + k * 12;
      var gy = MAZE_Y + s.y - k * 20;
      var gr = bg.createRadialGradient(s.x, gy, 0, s.x, gy, rad);
      gr.addColorStop(0, 'rgba(214,224,246,' + a.toFixed(3) + ')');
      gr.addColorStop(1, 'rgba(214,224,246,0)');
      bg.fillStyle = gr;
      bg.fillRect(s.x - rad, gy - rad, rad * 2, rad * 2);
    }
    for (i = 0; i < P.lights.length; i++) {      // traffic signals
      s = P.lights[i];
      var ph = Math.floor((G.t * 0.5 + i * 0.7) % 3);
      bg.fillStyle = '#171a22';
      bg.fillRect(s.x - 2, MAZE_Y + s.y - 5, 4, 10);
      bg.fillStyle = ph === 0 ? '#ff4d4d' : '#3a1416';
      bg.fillRect(s.x - 1, MAZE_Y + s.y - 4, 2, 2);
      bg.fillStyle = ph === 1 ? '#ffd75e' : '#3a3216';
      bg.fillRect(s.x - 1, MAZE_Y + s.y - 1, 2, 2);
      bg.fillStyle = ph === 2 ? '#4dff88' : '#153a22';
      bg.fillRect(s.x - 1, MAZE_Y + s.y + 2, 2, 2);
    }

    var pulse = 0.55 + 0.45 * Math.sin(G.t * 6);
    G.hammers.forEach(function (h) {
      var x = h.c * T + 1, y = MAZE_Y + h.r * T + 1 + Math.round(Math.sin(G.t * 4 + h.c) * 1.2);
      var cx = x + 7, cy = y + 7, rad = 13 + pulse * 4;
      var gr = bg.createRadialGradient(cx, cy, 1, cx, cy, rad);
      gr.addColorStop(0, 'rgba(255,215,94,' + (0.42 * pulse + 0.18).toFixed(3) + ')');
      gr.addColorStop(1, 'rgba(255,215,94,0)');
      bg.fillStyle = gr;
      bg.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
      bg.drawImage(S.HAMMER, x, y);
    });

    if (G.bonus) {
      var by = MAZE_Y + G.bonus.y - 8 + Math.round(Math.sin(G.t * 5) * 2);
      if (G.bonus.life > 2.5 || Math.floor(G.t * 8) % 2) {
        bg.drawImage(S.item(G.bonus.idx), Math.round(G.bonus.x) - 7, Math.round(by));
      }
    }

    if (G.state === 'levelclear' && Math.floor(G.stateT * 6) % 2) {
      bg.globalAlpha = 0.35;
      bg.fillStyle = G.district.neon;
      bg.fillRect(0, MAZE_Y, M.W, M.H);
      bg.globalAlpha = 1;
    }
  }

  function drawPerson(spec, x, y, vw, flip, pose, frame, opts, alpha) {
    var img = HU.build(spec, vw, pose, frame, opts);
    var d = HU.dims(spec);
    var px = Math.round(x), py = MAZE_Y + Math.round(y);
    bg.save();
    bg.imageSmoothingEnabled = false;
    if (alpha !== undefined) bg.globalAlpha = alpha;
    bg.drawImage(S.shadow(d.W - 6), px - (d.W - 6) / 2, py + (d.H - d.ay) - 5);
    if (vw === 'side' && flip) {
      bg.translate(px, 0);
      bg.scale(-1, 1);
      bg.drawImage(img, -d.ax, py - d.ay);
    } else {
      bg.drawImage(img, px - d.ax, py - d.ay);
    }
    bg.restore();
  }

  function drawActors() {
    var i, gh;
    if (G.state !== 'dying') {
      for (i = 0; i < G.rivals.length; i++) {
        gh = G.rivals[i];
        var pose = 'walk', expr = 'smug', alpha;
        if (gh.mode === 'cooked') { pose = 'scared'; expr = 'scared'; }
        else if (gh.mode === 'down' || gh.mode === 'hit') { pose = 'down'; expr = 'scared'; }
        else if (gh.mode === 'home') { pose = 'run'; expr = 'scared'; alpha = 0.55; }
        else if (gh.mode === 'club') { pose = 'idle'; }
        else if (!scattering()) pose = 'run';
        var flashOff = (gh.mode === 'cooked' && G.mogTimer < 2.2 && Math.floor(G.t * 8) % 2);
        drawPerson(gh.spec, gh.x, gh.y, gh.vw, gh.flip, pose, gh.frame,
                   { expr: expr, iris: flashOff ? '#ffffff' : undefined }, alpha);
      }
    }
    if (G.boss && G.boss.hp > 0) drawBoss();
    G.cars.forEach(function (c) { TR.draw(bg, c, MAZE_Y, G.t); });
    drawPlayer();
  }

  function drawBoss() {
    var b = G.boss;
    if (b.flashT > 0 && Math.floor(G.t * 20) % 2) return;
    var rad = 26 + Math.sin(G.t * 5) * 3;
    var gr = bg.createRadialGradient(b.x, MAZE_Y + b.y - 6, 2, b.x, MAZE_Y + b.y - 6, rad);
    gr.addColorStop(0, 'rgba(255,60,90,0.28)');
    gr.addColorStop(1, 'rgba(255,60,90,0)');
    bg.fillStyle = gr;
    bg.fillRect(b.x - rad, MAZE_Y + b.y - 6 - rad, rad * 2, rad * 2);
    drawPerson(b.spec, b.x, b.y, b.vw, b.flip,
               b.stun > 0 ? 'idle' : 'run', b.frame, { expr: 'angry' });
    // health pips over his head
    var w = b.maxHp * 7;
    bg.fillStyle = 'rgba(6,8,15,0.8)';
    bg.fillRect(b.x - w / 2 - 2, MAZE_Y + b.y - 44, w + 4, 7);
    for (var i = 0; i < b.maxHp; i++) {
      bg.fillStyle = i < b.hp ? '#ff4d6a' : '#3a2030';
      bg.fillRect(b.x - w / 2 + i * 7, MAZE_Y + b.y - 43, 5, 5);
    }
  }

  function drawPlayer() {
    var p = G.player;
    var tier = faceTier();
    var opts = { tier: tier, chain: tier >= 4, topOverride: PLAYER_TOPS[tier], mouth: p.mouth };

    if (G.state === 'dying') {
      var k = Math.min(1, G.stateT / 2.0);
      bg.save();
      bg.globalAlpha = Math.max(0, 1 - k);
      bg.imageSmoothingEnabled = false;
      bg.translate(Math.round(p.x), MAZE_Y + Math.round(p.y));
      bg.rotate(k * 2.6);
      bg.scale(1 - k * 0.5, 1 - k * 0.5);
      var d0 = HU.dims(HU.CAST.bp);
      var o2 = { tier: tier, expr: 'soy', topOverride: PLAYER_TOPS[tier] };
      bg.drawImage(HU.build(HU.CAST.bp, 'front', 'idle', 0, o2), -d0.ax, -d0.ay);
      bg.restore();
      if (G.stateT < 1.2) {
        FT.text(bg, 'MOGGED  -0.70 PSL', VIEW_W / 2, MAZE_Y + p.y - 52,
          { color: '#ff5b7a', align: 'center', shadow: '#000' });
      }
      return;
    }

    if (G.aura >= 100 || G.mogTimer > 0) {
      var rad = 24 + Math.sin(G.t * 8) * 3;
      var col = G.mogTimer > 0 ? '255,215,94' : '255,180,60';
      var gr = bg.createRadialGradient(p.x, MAZE_Y + p.y - 8, 2, p.x, MAZE_Y + p.y - 8, rad);
      gr.addColorStop(0, 'rgba(' + col + ',0.30)');
      gr.addColorStop(1, 'rgba(' + col + ',0)');
      bg.fillStyle = gr;
      bg.fillRect(p.x - rad, MAZE_Y + p.y - 8 - rad, rad * 2, rad * 2);
      for (var i = 0; i < 6; i++) {
        var a = G.t * 3 + i * (Math.PI / 3);
        var rr = rad - 5 + Math.sin(G.t * 9 + i) * 2;
        bg.fillStyle = i % 2 ? '#ffd75e' : '#fff3c4';
        bg.fillRect(Math.round(p.x + Math.cos(a) * rr), Math.round(MAZE_Y + p.y - 8 + Math.sin(a) * rr), 2, 2);
      }
    }
    if (p.running && p.moving) {                 // speed streaks
      for (var s = 0; s < 3; s++) {
        bg.fillStyle = 'rgba(200,220,255,' + (0.3 - s * 0.08) + ')';
        bg.fillRect(Math.round(p.x - p.dir[0] * (8 + s * 5) - 3), MAZE_Y + Math.round(p.y - 6 + s * 4), 6, 1);
      }
    }

    if (p.invuln > 0 && Math.floor(G.t * 16) % 2) return;
    var pose = p.stun > 0 ? 'down' : (p.moving ? (p.running ? 'run' : 'walk') : 'idle');
    drawPerson(HU.CAST.bp, p.x, p.y, p.vw, p.flip, pose, p.frame, opts);

    if (G.mogTimer > 0 && p.stun <= 0) {         // the hammer, shouldered
      var hx = Math.round(p.x) + (p.vw === 'side' && p.flip ? -19 : 5);
      bg.save();
      bg.imageSmoothingEnabled = false;
      if (p.swing > 0) {
        bg.translate(hx + 7, MAZE_Y + Math.round(p.y) - 4);
        bg.rotate(Math.PI * 0.55 * (p.flip ? -1 : 1));
        bg.drawImage(S.HAMMER, -7, -7);
      } else {
        bg.drawImage(S.HAMMER, hx, MAZE_Y + Math.round(p.y) - 14);
      }
      bg.restore();
    }
  }

  function drawFx() {
    var i, p;
    if (G.wave) {
      var a = Math.max(0, G.wave.life / 0.85);
      bg.strokeStyle = 'rgba(255,215,94,' + (a * 0.9) + ')';
      bg.lineWidth = 3;
      bg.beginPath(); bg.arc(G.wave.x, MAZE_Y + G.wave.y, G.wave.r, 0, Math.PI * 2); bg.stroke();
      bg.strokeStyle = 'rgba(255,91,208,' + (a * 0.55) + ')';
      bg.lineWidth = 6;
      bg.beginPath(); bg.arc(G.wave.x, MAZE_Y + G.wave.y, Math.max(0, G.wave.r - 9), 0, Math.PI * 2); bg.stroke();
      bg.lineWidth = 1;
    }
    for (i = 0; i < G.particles.length; i++) {
      p = G.particles[i];
      bg.globalAlpha = Math.max(0, Math.min(1, p.life / p.max));
      bg.fillStyle = p.col;
      bg.fillRect(Math.round(p.x), MAZE_Y + Math.round(p.y), p.size, p.size);
    }
    bg.globalAlpha = 1;
    for (i = 0; i < G.pops.length; i++) {
      p = G.pops[i];
      bg.globalAlpha = Math.max(0, Math.min(1, p.life / 0.8));
      FT.text(bg, p.text, p.x, MAZE_Y + p.y, { color: p.col, align: 'center', shadow: '#000' });
    }
    bg.globalAlpha = 1;
  }

  /* ---------------- HUD ---------------- */
  function pad(n, w) { var s = String(n); while (s.length < w) s = '0' + s; return s; }

  function pslBar(x, y, w, h) {
    bg.fillStyle = '#0b0e18';
    bg.fillRect(x, y, w, h);
    var i, tx;
    for (i = 1; i < TIERS.length; i++) {          // tier gates
      tx = x + Math.round(w * (TIERS[i].psl - 1) / 9);
      bg.fillStyle = 'rgba(255,255,255,0.16)';
      bg.fillRect(tx, y, 1, h);
    }
    var fw = Math.round(w * Math.max(0, (G.psl - 1) / 9));
    var grd = bg.createLinearGradient(x, 0, x + w, 0);
    grd.addColorStop(0, '#4de1ff');
    grd.addColorStop(0.55, '#ff5bd0');
    grd.addColorStop(1, '#ffd75e');
    bg.fillStyle = grd;
    bg.fillRect(x, y, fw, h);
    bg.fillStyle = 'rgba(255,255,255,0.28)';
    bg.fillRect(x, y, fw, 1);
    // best-so-far marker
    var bx = x + Math.round(w * Math.max(0, (G.best - 1) / 9));
    bg.fillStyle = '#ffffff';
    bg.fillRect(bx, y - 2, 1, h + 4);
    bg.strokeStyle = 'rgba(255,255,255,0.3)';
    bg.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }

  function meter(x, y, w, h, v, col, back) {
    bg.fillStyle = back; bg.fillRect(x, y, w, h);
    var fw = Math.round(w * Math.max(0, Math.min(1, v)));
    bg.fillStyle = col; bg.fillRect(x, y, fw, h);
    bg.fillStyle = 'rgba(255,255,255,0.2)'; bg.fillRect(x, y, fw, 1);
    bg.strokeStyle = 'rgba(255,255,255,0.22)';
    bg.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }

  function drawHud() {
    bg.drawImage(G.skyImg, 0, 0);
    bg.fillStyle = 'rgba(5,6,11,0.5)';
    bg.fillRect(0, 0, VIEW_W, HUD_TOP);

    FT.text(bg, 'PSL', 8, 5, { color: '#9fb4ff' });
    FT.text(bg, G.psl.toFixed(2), 8, 15, { color: '#ffffff', scale: 4, shadow: '#2a1140' });
    pslBar(112, 31, 240, 9);
    FT.text(bg, TIERS[G.tier].name, 112, 19, { color: '#ffd75e' });
    var nx = TIERS[Math.min(TIERS.length - 1, G.tier + 1)];
    FT.text(bg, G.tier >= TIERS.length - 1 ? 'MAX TIER' : 'NEXT ' + nx.psl.toFixed(1),
      352, 19, { color: '#6f7bb0', align: 'right' });
    FT.text(bg, G.district ? G.district.name : '', VIEW_W - 8, 5,
      { color: G.district ? G.district.neon : '#fff', align: 'right' });
    FT.text(bg, 'BEST ' + G.best.toFixed(2), VIEW_W - 8, 16, { color: '#ffd75e', align: 'right' });
    FT.text(bg, 'SCORE ' + pad(G.score, 6), VIEW_W - 8, 27, { color: '#cfd6e4', align: 'right' });
    FT.text(bg, 'BLOCK ' + pad(G.level, 2), VIEW_W - 8, 38, { color: '#6f7bb0', align: 'right' });

    bg.fillStyle = G.district ? G.district.neon : '#4de1ff';
    bg.fillRect(0, HUD_TOP - 1, VIEW_W, 1);
    bg.fillRect(0, HUD_Y, VIEW_W, 1);

    var grd = bg.createLinearGradient(0, HUD_Y, 0, VIEW_H);
    grd.addColorStop(0, '#141033');
    grd.addColorStop(1, '#07060f');
    bg.fillStyle = grd;
    bg.fillRect(0, HUD_Y + 1, VIEW_W, HUD_BOT);

    var py = HUD_Y + 8;
    bg.fillStyle = '#0b0d18';
    bg.fillRect(6, py, 44, 50);
    bg.strokeStyle = G.district ? G.district.neon : '#4de1ff';
    bg.strokeRect(6.5, py + 0.5, 43, 49);
    bg.save();
    bg.imageSmoothingEnabled = false;
    bg.drawImage(faceImg('front', faceTier()), 8, py + 1, FACE.W * 2, FACE.H * 2);
    bg.restore();

    FT.text(bg, 'STAMINA', 58, HUD_Y + 8, { color: '#9fb4ff' });
    meter(112, HUD_Y + 7, 120, 7, G.stamina / 100,
      G.stamina < 20 ? '#ff5b7a' : '#4dff9e', '#101a33');
    FT.text(bg, 'SHIFT TO RUN', 240, HUD_Y + 8, { color: G.player && G.player.running ? '#4dff9e' : '#4a5578' });

    FT.text(bg, 'AURA', 58, HUD_Y + 22, { color: '#9fb4ff' });
    var ready = G.aura >= 100;
    meter(112, HUD_Y + 21, 120, 7, G.aura / 100,
      ready ? (Math.floor(G.t * 8) % 2 ? '#fff3c4' : '#ffd75e') : '#4de1ff', '#101a33');
    FT.text(bg, ready ? 'SPACE = BURST' : 'CHARGING',
      240, HUD_Y + 22, { color: ready ? (Math.floor(G.t * 4) % 2 ? '#ffd75e' : '#ff5bd0') : '#4a5578' });

    if (G.mogTimer > 0) {
      FT.text(bg, 'HAMMER ' + G.mogTimer.toFixed(1) + '  X' + Math.max(1, G.mogStreak),
        58, HUD_Y + 36, { color: '#ffd75e' });
    } else if (G.boss && G.boss.hp > 0) {
      FT.text(bg, 'APEX HP ' + G.boss.hp + '  -  HAMMER OR AURA ONLY',
        58, HUD_Y + 36, { color: '#ff5b7a' });
    } else {
      FT.text(bg, 'MOGS ' + G.mogs + '   PILLS LEFT ' + G.pillsLeft, 58, HUD_Y + 36, { color: '#6f7bb0' });
    }
    FT.text(bg, 'GOAL: HIGHEST PSL     CABS COST YOU RATING', 58, HUD_Y + 48, { color: '#4a5578' });

    for (var i = 0; i < Math.max(0, G.lives - 1); i++) {
      bg.save();
      bg.imageSmoothingEnabled = false;
      bg.drawImage(faceImg('front', faceTier()), VIEW_W - 26 - i * 22, HUD_Y + 10, 20, 24);
      bg.restore();
    }
    FT.text(bg, 'LIVES', VIEW_W - 8, HUD_Y + 38, { color: '#6f7bb0', align: 'right' });
    if (A.isMuted()) FT.text(bg, 'MUTED', VIEW_W - 8, HUD_Y + 50, { color: '#ff5b7a', align: 'right' });
  }

  /* ---------------- overlays ---------------- */
  function dim(a) { bg.fillStyle = 'rgba(4,5,12,' + a + ')'; bg.fillRect(0, 0, VIEW_W, VIEW_H); }

  function drawOverlays() {
    var cy = MAZE_Y + M.H / 2;
    if (G.state === 'ready') {
      var boss = CITY.isBoss(G.level);
      FT.text(bg, G.district.name, VIEW_W / 2, cy - 46,
        { color: G.district.neon, align: 'center', scale: 3, shadow: '#000' });
      FT.text(bg, G.district.sub, VIEW_W / 2, cy - 18, { color: '#9fb4ff', align: 'center' });
      if (Math.floor(G.stateT * 3) % 2 === 0 || G.stateT > 1.4) {
        FT.text(bg, boss ? 'APEX IS HERE' : 'RAISE YOUR PSL', VIEW_W / 2, cy + 6,
          { color: '#ffd75e', align: 'center', scale: 3, shadow: '#5a1a3a' });
      }
      FT.text(bg, 'ARROWS OR WASD - WALK     SHIFT - RUN', VIEW_W / 2, cy + 44,
        { color: '#9fb4ff', align: 'center' });
    }
    if (G.paused) {
      dim(0.72);
      FT.text(bg, 'PAUSED', VIEW_W / 2, cy - 10, { color: '#fff', align: 'center', scale: 4, shadow: '#ff5bd0' });
      FT.text(bg, 'P TO RESUME   M MUTE', VIEW_W / 2, cy + 30, { color: '#9fb4ff', align: 'center' });
    }
    if (G.state === 'ascend') drawAscend();
    if (G.state === 'levelclear' && G.bossDown) {
      FT.text(bg, 'APEX IS MOGGED', VIEW_W / 2, cy - 30,
        { color: '#ffd75e', align: 'center', scale: 3, shadow: '#000' });
      FT.text(bg, '+1.20 PSL', VIEW_W / 2, cy + 6, { color: '#7cf5d0', align: 'center', scale: 2 });
    }
    if (G.state === 'gameover') drawGameOver(cy);
  }

  function drawGameOver(cy) {
    dim(0.85);
    var best = G.peak >= G.best;
    FT.text(bg, 'RUN OVER', VIEW_W / 2, cy - 150, { color: '#ff5b7a', align: 'center', scale: 3, shadow: '#000' });
    bg.save(); bg.imageSmoothingEnabled = false;
    bg.drawImage(faceImg('front', faceTier()), VIEW_W / 2 - 110, cy - 110, 100, 120);
    bg.drawImage(faceImg('side', faceTier()), VIEW_W / 2 + 10, cy - 110, 100, 120);
    bg.restore();
    FT.text(bg, 'FINAL PSL', VIEW_W / 2, cy + 26, { color: '#9fb4ff', align: 'center' });
    FT.text(bg, G.peak.toFixed(2), VIEW_W / 2, cy + 40,
      { color: '#ffd75e', align: 'center', scale: 5, shadow: '#2a1140' });
    FT.text(bg, TIERS[tierFor(G.peak)].name, VIEW_W / 2, cy + 86,
      { color: '#7cf5d0', align: 'center', scale: 2 });
    if (best && Math.floor(G.t * 3) % 2) {
      FT.text(bg, 'NEW PERSONAL BEST', VIEW_W / 2, cy + 112, { color: '#ff5bd0', align: 'center', scale: 2 });
    } else {
      FT.text(bg, 'BEST ' + G.best.toFixed(2), VIEW_W / 2, cy + 112, { color: '#6f7bb0', align: 'center' });
    }
    FT.text(bg, 'MOGS ' + G.mogs + '   BLOCKS ' + G.level + '   SCORE ' + pad(G.score, 6),
      VIEW_W / 2, cy + 136, { color: '#cfd6e4', align: 'center' });
    if (Math.floor(G.t * 2) % 2) {
      FT.text(bg, 'PRESS ENTER TO RUN IT BACK', VIEW_W / 2, cy + 162, { color: '#4de1ff', align: 'center' });
    }
  }

  function drawAscend() {
    var k = Math.min(1, G.stateT / 0.35);
    dim(0.88 * k);
    var cy = MAZE_Y + M.H / 2;
    var to = TIERS[G.tier];
    FT.text(bg, 'PSL ' + G.psl.toFixed(2), VIEW_W / 2, cy - 150, { color: '#9fb4ff', align: 'center', scale: 2 });
    FT.text(bg, to.name, VIEW_W / 2, cy - 122,
      { color: Math.floor(G.t * 8) % 2 ? '#ffd75e' : '#ff5bd0', align: 'center', scale: 4, shadow: '#000' });

    var sc = 4, fw = FACE.W * sc, fh = FACE.H * sc, gap = 20;
    var x0 = Math.round((VIEW_W - (fw * 3 + gap * 2)) / 2);
    var top = cy - 60, showNew = G.stateT > 0.85;
    bg.save();
    bg.imageSmoothingEnabled = false;
    bg.globalAlpha = 0.4;
    bg.drawImage(faceImg('front', G.ascendFrom), x0, top, fw, fh);
    bg.globalAlpha = 1;
    if (showNew) {
      bg.globalAlpha = Math.min(1, (G.stateT - 0.85) / 0.35);
      bg.drawImage(faceImg('front', G.ascendTo), x0 + fw + gap, top, fw, fh);
      bg.drawImage(faceImg('side', G.ascendTo), x0 + (fw + gap) * 2, top, fw, fh);
      bg.globalAlpha = 1;
      bg.strokeStyle = '#ffd75e';
      bg.strokeRect(x0 + fw + gap - 2.5, top - 2.5, fw * 2 + gap + 5, fh + 5);
    }
    bg.restore();
    FT.text(bg, 'BEFORE', x0 + fw / 2, top + fh + 8, { color: '#6f7bb0', align: 'center' });
    if (showNew) {
      FT.text(bg, 'AFTER', x0 + fw * 2 + gap * 1.5, top + fh + 8, { color: '#ffd75e', align: 'center' });
      FT.text(bg, to.blurb, VIEW_W / 2, top + fh + 30, { color: '#7cf5d0', align: 'center' });
    }
    FT.text(bg, '>', x0 + fw + gap / 2 - 1, top + fh / 2 - 10, { color: '#ffd75e', align: 'center', scale: 2 });
  }

  /* ---------------- title ---------------- */
  function drawTitle() {

    if (Math.floor(G.t * 2) % 2) {
      FT.text(bg, 'PRESS ENTER OR CLICK TO START', VIEW_W / 2, VIEW_H - 54,

    }

      VIEW_W / 2, VIEW_H - 26, { color: '#6f7bb0', align: 'center' });

  /* ---------------- input ---------------- */
  function setDir(d) { if (G.state === 'play' || G.state === 'ready') G.player.want = d; }

  function newGame(startLevel) {
    G.score = 0; G.level = startLevel || 1; G.lives = 3;
    G.psl = 2.0; G.peak = 2.0; G.tier = 0; G.mogs = 0;
    G.aura = 0; G.stamina = 100;
    G.particles = []; G.pops = []; G.wave = null;
    loadLevel();
    G.state = 'ready'; G.stateT = 0;
    A.init(); A.resume(); A.sfx.start();
  }

  function keydown(e) {
    var k = e.key;
    A.resume();
    if (k === 'ArrowUp' || k === 'w' || k === 'W') setDir(UP);
    else if (k === 'ArrowDown' || k === 's' || k === 'S') setDir(DOWN);
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') setDir(LEFT);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') setDir(RIGHT);
    else if (k === 'Shift') { if (G.player) G.player.wantRun = true; }
    else if (k === ' ') fireAura();
    else if (k === 'p' || k === 'P') { if (G.state === 'play') { G.paused = !G.paused; A.sfx.ui(); } }
    else if (k === 'm' || k === 'M') { A.toggle(); A.sfx.ui(); }
    else if (k === 'Enter') { if (G.state === 'title' || G.state === 'gameover') newGame(); }
    else return;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(k) >= 0) e.preventDefault();
  }
  function keyup(e) { if (e.key === 'Shift' && G.player) G.player.wantRun = false; }

  function bindTouch(el) {
    var sx = 0, sy = 0, st = 0, held = null;
    el.addEventListener('touchstart', function (e) {
      var t0 = e.changedTouches[0];
      sx = t0.clientX; sy = t0.clientY; st = Date.now();
      A.resume();
      held = setTimeout(function () { if (G.player) G.player.wantRun = true; }, 220);
    }, { passive: true });
    el.addEventListener('touchend', function (e) {
      clearTimeout(held);
      if (G.player) G.player.wantRun = false;
      var t0 = e.changedTouches[0];
      var dx = t0.clientX - sx, dy = t0.clientY - sy;
      if (Math.abs(dx) < 18 && Math.abs(dy) < 18 && Date.now() - st < 400) {
        if (G.state === 'title' || G.state === 'gameover') newGame();
        else fireAura();
        return;
      }
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? RIGHT : LEFT);
      else setDir(dy > 0 ? DOWN : UP);
    }, { passive: true });
    el.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  }

  function start(el) {
    setup(el);
    loadLevel();
    G.state = 'title';
    window.addEventListener('keydown', keydown);
    window.addEventListener('keyup', keyup);
    el.addEventListener('keydown', keydown);
    el.addEventListener('keyup', keyup);
    el.setAttribute('tabindex', '0');
    try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
    bindTouch(el);
    el.addEventListener('mousedown', function () {
      A.resume();
      try { el.focus({ preventScroll: true }); } catch (e) {}
      if (G.state === 'title' || G.state === 'gameover') newGame();
    });

    var last = performance.now(), acc = 0, STEP = 1 / 60;
    function frame(now) {
      var dt = Math.min(0.25, (now - last) / 1000);
      last = now;
      if (!G.paused) {
        acc += dt;
        var guard = 0;
        while (acc >= STEP && guard++ < 8) { update(STEP); acc -= STEP; }
      } else G.t += dt;
      render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  BP.game = {
    start: start, state: G, TIERS: TIERS, VIEW_W: VIEW_W, VIEW_H: VIEW_H,
    _update: update, _newGame: newGame, _fireAura: fireAura, _setDir: setDir,
    _tierFor: tierFor, _dirs: { UP: UP, DOWN: DOWN, LEFT: LEFT, RIGHT: RIGHT }
  };
})(window.BP = window.BP || {});


(function () {
  var boot = document.getElementById('boot');
  try {
    window.BP.game.start(document.getElementById('screen'));
    if (boot) boot.parentNode.removeChild(boot);
  } catch (err) {
    if (boot) boot.textContent = 'FAILED TO BOOT: ' + err.message;
    throw err;
  }
})();
</script>
